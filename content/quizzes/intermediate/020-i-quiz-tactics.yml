topic: Tactics & Doubles
title: Shot Selection & Doubles Basics
description: Decision-making during rallies and doubles positioning.
questions:
  - id: q1
    question: What is generally the higher-percentage shot to hit from a defensive position behind the baseline?
    options:
      - An aggressive winner down the line
      - A high, deep, controlled shot back to the middle or crosscourt
      - A drop shot
      - A hard flat shot aimed at the sideline
    answer: A high, deep, controlled shot back to the middle or crosscourt
    explanation: From defense, a high-margin deep shot (often crosscourt) is safer than attempting a low-percentage winner.
  - id: q2
    question: In a standard doubles "up-and-back" formation, what is the net player's primary role?
    options:
      - To stay passive and only retrieve lobs
      - To poach and finish points at the net
      - To serve every point
      - To cover the entire baseline alone
    answer: To poach and finish points at the net
    explanation: The net player looks for opportunities to intercept (poach) and put the ball away, while the baseline player builds the point.
  - id: q3
    question: What should doubles partners do when one of them is pulled wide out of position?
    options:
      - The other partner stays exactly where they were
      - Both players shift together to cover the space, like connected by a rope
      - The player at net should retreat to the baseline immediately
      - Nothing — doubles partners move independently
    answer: Both players shift together to cover the space, like connected by a rope
    explanation: Doubles partners should shift together as a unit to avoid leaving large gaps in coverage.
  - id: q4
    question: What is a good rule of thumb before attempting a low-percentage winner during a rally?
    options:
      - Always go for it regardless of the situation
      - Ask if you can make the shot roughly 8 out of 10 times
      - Only attempt winners on your weaker side
      - Winners should only be attempted on set point
    answer: Ask if you can make the shot roughly 8 out of 10 times
    explanation: A useful gut check is whether you can execute the shot reliably (e.g. 8/10) rather than gambling on a low-percentage attempt.
