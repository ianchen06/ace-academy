topic: Grips & Footwork
title: Grip Selection & Footwork Basics
description: Bevels, the four forehand grips, and how you move to the ball.
questions:
  - id: q1
    question: Which bevel does the base knuckle of your index finger sit on for an Eastern forehand grip?
    options:
      - Bevel 1
      - Bevel 2
      - Bevel 3
      - Bevel 5
    answer: Bevel 3
    explanation: >-
      Bevels are numbered from the flat top face clockwise for a right-hander: Continental is bevel
      2, Eastern bevel 3, Semi-Western bevel 4 and Western bevel 5.
  - id: q2
    question: >-
      Which grip is generally the best starting point for a player learning groundstrokes on fast,
      low-bouncing courts?
    options:
      - Western
      - Eastern
      - Continental
      - Whichever grip your favourite pro uses
    answer: Eastern
    explanation: >-
      Eastern gives a square face at a comfortable waist-height contact, handles low balls well, and
      changes quickly to Continental for volleys and slice.
  - id: q3
    question: When should you use crossover steps rather than side shuffles?
    options:
      - Only when moving forward to the net
      - When the ball is more than about two steps away
      - Never — shuffling is always safer
      - Only on second serves
    answer: When the ball is more than about two steps away
    explanation: >-
      Shuffles are for short adjustments; beyond a couple of steps the crossover step covers ground
      far faster, and shuffling to a wide ball is a classic reason for arriving late.
  - id: q4
    question: What are the small stutter steps taken just before contact for?
    options:
      - Slowing yourself down to save energy
      - Fine-tuning your distance from the ball so you can extend through contact
      - Signalling to your partner in doubles
      - Adding power to the shot
    answer: Fine-tuning your distance from the ball so you can extend through contact
    explanation: >-
      Adjustment steps set the correct spacing — roughly an arm plus racquet away, ball beside your
      front hip — which is what makes a clean contact possible.
  - id: q5
    question: On the Eastern forehand, where should contact happen?
    options:
      - Behind your body, close to your back hip
      - Roughly waist height, slightly in front of your front hip
      - Above your head, as far forward as possible
      - Directly beside your back shoulder
    answer: Roughly waist height, slightly in front of your front hip
    explanation: >-
      Eastern contact is waist high and slightly in front of the front hip; contacting behind the
      body is usually a footwork problem and sprays the ball sideways.
  - id: q6
    question: Your forehands keep landing in the net. Which cause fits that pattern best?
    options:
      - The racquet head never dropped below the ball, or your head lifted early
      - You contacted the ball too far in front
      - Your grip was too relaxed
      - You recovered to the centre mark too quickly
    answer: The racquet head never dropped below the ball, or your head lifted early
    explanation: >-
      A low-to-high path requires the racquet head to start below the ball; failing to drop it (or
      lifting your head before contact) is the usual cause of netted forehands.
